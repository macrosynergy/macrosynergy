name: Build & Push Docker Image to ECR

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Git tag to build and push (e.g. v1.5.6), or latest for the newest v* tag"
        required: true
        default: "latest"
        type: string
      develop:
        description: "Build the develop commit this run is on instead, tagged <version>-develop-<sha> (ignores version)"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      tag:
        description: "Git tag to build and push"
        required: true
        type: string
    secrets:
      AWS_ROLE:
        required: true
      ECR_REPOSITORY:
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.check-tag.outputs.ref }}
      ms_version: ${{ steps.check-tag.outputs.ms_version }}
      image_tag: ${{ steps.check-tag.outputs.image_tag }}
      is_latest: ${{ steps.check-tag.outputs.is_latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install setuptools
        run: pip install --quiet setuptools

      - name: Verify tag exists and inspect
        id: check-tag
        env:
          TAG: ${{ inputs.tag || inputs.version }}
          DEVELOP: ${{ inputs.develop }}
        run: |
          set -eu
          if [ "${DEVELOP}" = "true" ]; then
            if [ "${GITHUB_REF}" != "refs/heads/develop" ]; then
              echo "::error::develop=true builds the develop branch; dispatch it with --ref develop (this run is on '${GITHUB_REF}'). Aborting."
              exit 1
            fi
            if [ "${TAG}" != "latest" ]; then
              echo "::warning::develop=true ignores version '${TAG}'."
            fi
            MS_VERSION=$(python ./setup.py --version 2>/dev/null | tail -n 1)
            # e.g. 1.8.6.dev0+3ba680c; a Docker tag cannot hold "+", so keep 1.8.6.
            BASE_VERSION=$(echo "${MS_VERSION}" | sed -E 's/\.?dev.*//; s/\+.*//')
            SHA=$(git rev-parse HEAD)
            IMAGE_TAG="${BASE_VERSION}-develop-$(git rev-parse --short=7 HEAD)"
            echo "Develop commit ${SHA}, MS_VERSION=${MS_VERSION}, image tag ${IMAGE_TAG}"
            {
              echo "ref=${SHA}"
              echo "ms_version=${MS_VERSION}"
              echo "image_tag=${IMAGE_TAG}"
              echo "is_latest=false"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ "${TAG}" = "latest" ]; then
            TAG="${LATEST_TAG}"
            echo "version 'latest' is tag '${TAG}'."
          fi

          if ! git show-ref --verify --quiet "refs/tags/${TAG}"; then
            echo "::error::Tag '${TAG}' does not exist in this repository. Aborting."
            exit 1
          fi
          echo "Tag '${TAG}' exists."
          echo "ref=${TAG}" >> "${GITHUB_OUTPUT}"

          echo "Latest tag in repo: ${LATEST_TAG}"

          IS_LATEST=false
          if [ "${TAG}" = "${LATEST_TAG}" ]; then
            IS_LATEST=true
          fi
          echo "is_latest=${IS_LATEST}"
          echo "is_latest=${IS_LATEST}" >> "${GITHUB_OUTPUT}"

          git checkout --quiet "${TAG}"
          MS_VERSION=$(python ./setup.py --version 2>/dev/null | tail -n 1)
          echo "MS_VERSION=${MS_VERSION}"
          echo "ms_version=${MS_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "image_tag=${MS_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Poll PyPI for macrosynergy
        if: ${{ !inputs.develop }}
        env:
          MS_VERSION: ${{ steps.check-tag.outputs.ms_version }}
          IS_LATEST: ${{ steps.check-tag.outputs.is_latest }}
        run: |
          set -u
          URL="https://pypi.org/pypi/macrosynergy/${MS_VERSION}/json"
          MAX_ATTEMPTS=10
          SLEEP_SECS=60

          for ATTEMPT in $(seq 1 ${MAX_ATTEMPTS}); do
            CODE=$(curl -s -o /tmp/pypi_ver.json -w "%{http_code}" "${URL}" || echo "000")
            echo "Attempt ${ATTEMPT}/${MAX_ATTEMPTS}: HTTP ${CODE} for ${URL}"

            if [ "${CODE}" = "200" ]; then
              YANKED=$(jq -r '.info.yanked // false' /tmp/pypi_ver.json)
              if [ "${YANKED}" = "true" ]; then
                REASON=$(jq -r '.info.yanked_reason // "(no reason given)"' /tmp/pypi_ver.json)
                echo "::warning::macrosynergy ${MS_VERSION} is YANKED on PyPI. Reason: ${REASON}. Proceeding with build."
              fi
              echo "macrosynergy ${MS_VERSION} is available on PyPI."
              exit 0
            fi

            if [ "${IS_LATEST}" != "true" ]; then
              echo "::error::Tag is not the latest and macrosynergy ${MS_VERSION} is not on PyPI (HTTP ${CODE})."
              curl -s -o /tmp/pypi_pkg.json "https://pypi.org/pypi/macrosynergy/json" || true
              REL_PRESENT=$(jq --arg v "${MS_VERSION}" '.releases | has($v)' /tmp/pypi_pkg.json 2>/dev/null || echo "error")
              if [ "${REL_PRESENT}" = "true" ]; then
                FILE_COUNT=$(jq --arg v "${MS_VERSION}" '.releases[$v] | length' /tmp/pypi_pkg.json)
                if [ "${FILE_COUNT}" = "0" ]; then
                  echo "::error::Version ${MS_VERSION} is listed in PyPI releases but has no files (possibly deleted)."
                else
                  ALL_YANKED=$(jq --arg v "${MS_VERSION}" '[.releases[$v][] | .yanked] | all' /tmp/pypi_pkg.json)
                  if [ "${ALL_YANKED}" = "true" ]; then
                    REASONS=$(jq -r --arg v "${MS_VERSION}" '[.releases[$v][] | .yanked_reason // "(no reason)"] | unique | join(", ")' /tmp/pypi_pkg.json)
                    echo "::error::Version ${MS_VERSION} was YANKED on PyPI. Reason(s): ${REASONS}."
                  else
                    echo "::error::Version ${MS_VERSION} exists in PyPI releases but version endpoint returned HTTP ${CODE}. Unexpected state."
                  fi
                fi
              else
                echo "::error::Version ${MS_VERSION} is not listed in PyPI releases (never published, or fully deleted)."
              fi
              exit 1
            fi

            if [ ${ATTEMPT} -lt ${MAX_ATTEMPTS} ]; then
              echo "Latest tag ${MS_VERSION} not yet on PyPI. Sleeping ${SLEEP_SECS}s before retry..."
              sleep ${SLEEP_SECS}
            fi
          done

          TOTAL_MIN=$((MAX_ATTEMPTS * SLEEP_SECS / 60))
          echo "::error::macrosynergy ${MS_VERSION} did not appear on PyPI after ${MAX_ATTEMPTS} polls at ${SLEEP_SECS}s intervals (${TOTAL_MIN} minutes total). Giving up."
          exit 1

  build-and-push:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.ref }}

      - name: Set up AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: eu-west-2

      - name: Build and push Docker image to ECR
        env:
          MS_VERSION: ${{ needs.verify.outputs.ms_version }}
          IMAGE_TAG: ${{ needs.verify.outputs.image_tag }}
          IS_LATEST: ${{ needs.verify.outputs.is_latest }}
          # develop: the Dockerfile's develop stage (macrosynergy from this checkout). A
          # release builds the default stage, so a tag from before the stages still builds.
          TARGET: ${{ inputs.develop && 'develop' || '' }}
          DOCKER_BUILDKIT: 1
        run: |
          aws ecr get-login-password --region eu-west-2 | docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY }}
          docker build ${TARGET:+--target "${TARGET}"} -t "${{ secrets.ECR_REPOSITORY }}:${IMAGE_TAG}" . --build-arg "MS_VERSION=${MS_VERSION}"
          docker push "${{ secrets.ECR_REPOSITORY }}:${IMAGE_TAG}"
          # :latest moves only for the newest tag, never for develop.
          if [ "${IS_LATEST}" = "true" ]; then
            docker tag "${{ secrets.ECR_REPOSITORY }}:${IMAGE_TAG}" ${{ secrets.ECR_REPOSITORY }}:latest
            docker push ${{ secrets.ECR_REPOSITORY }}:latest
          fi
